<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área da Professora | Bio sem mistério</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #f0f7ef;
      color: #183b20;
    }

    .painel {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px #173b201a;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #b8cbb9;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #1b5e20;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .sair {
      background: #777;
      float: right;
      margin-top: 0;
    }

    .oculto {
      display: none;
    }

    #mensagemLogin,
    #mensagem {
      margin-top: 16px;
      font-weight: bold;
    }

    .aula {
      border-top: 1px solid #d9e4da;
      padding: 18px 0;
    }

    .aula:first-child {
      border-top: 0;
    }

    .aula h3 {
      margin: 0 0 8px;
    }

    .aula p {
      white-space: pre-wrap;
      color: #526354;
    }
  </style>
</head>

<body>

  <main class="painel">

    <!-- TELA DE LOGIN -->
    <section id="telaLogin" class="card">

      <h1>🌿 Bio sem mistério</h1>

      <h2>Área da professora</h2>

      <p>Entre para acessar o painel.</p>

      <form id="formLogin">

        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="Digite seu e-mail"
          required
        >

        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          placeholder="Digite sua senha"
          required
        >

        <button type="submit">Entrar</button>

        <p id="mensagemLogin"></p>

      </form>

    </section>


    <!-- PAINEL DA PROFESSORA -->
    <section id="painelProfessora" class="oculto">

      <section class="card">

        <button id="btnSair" class="sair">Sair</button>

        <h1>🌿 BioAulas</h1>

        <p>Área da professora</p>

      </section>


      <section class="card">

        <h2>Nova aula</h2>

        <form id="formAula">

          <label for="titulo">Título da aula</label>

          <input
            id="titulo"
            type="text"
            required
          >

          <label for="descricao">Descrição</label>

          <input
            id="descricao"
            type="text"
          >

          <label for="conteudo">Conteúdo</label>

          <textarea
            id="conteudo"
            required
          ></textarea>

          <button type="submit">
            Cadastrar aula
          </button>

          <p id="mensagem"></p>

        </form>

      </section>


      <section class="card">

        <h2>Aulas cadastradas</h2>

        <div id="listaAulas">
          Carregando aulas...
        </div>

      </section>

    </section>

  </main>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://ishkkvikgwwstisspgjc.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzaGtrdmlrZ3d3c3Rpc3NwZ2pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MzA3NzYsImV4cCI6MjEwODIwNjc3Nn0.Cj4mBGiGjBkV2aqmwjhohltHRN1TimukobTpABdoOnY";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const telaLogin =
      document.getElementById("telaLogin");

    const painelProfessora =
      document.getElementById("painelProfessora");

    const formLogin =
      document.getElementById("formLogin");

    const mensagemLogin =
      document.getElementById("mensagemLogin");

    const formAula =
      document.getElementById("formAula");

    const mensagem =
      document.getElementById("mensagem");

    const listaAulas =
      document.getElementById("listaAulas");

    const btnSair =
      document.getElementById("btnSair");


    // LOGIN
    formLogin.addEventListener("submit", async function(event) {

      event.preventDefault();

      mensagemLogin.textContent = "Entrando...";


      const email =
        document.getElementById("email").value;

      const senha =
        document.getElementById("senha").value;


      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: senha
        });


      if (error) {

        mensagemLogin.textContent =
          "E-mail ou senha incorretos.";

        return;
      }


      mensagemLogin.textContent =
        "Login realizado!";


      mostrarPainel();

    });


    // MOSTRAR PAINEL
    async function mostrarPainel() {

      telaLogin.classList.add("oculto");

      painelProfessora.classList.remove("oculto");

      carregarAulas();

    }


    // CARREGAR AULAS
    async function carregarAulas() {

      const { data, error } =
        await supabaseClient
          .from("aulas")
          .select("*")
          .order("id", { ascending: false });


      if (error) {

        listaAulas.textContent =
          "Erro ao carregar aulas: " +
          error.message;

        return;
      }


      if (!data || data.length === 0) {

        listaAulas.textContent =
          "Nenhuma aula cadastrada ainda.";

        return;
      }


      listaAulas.innerHTML = "";


      data.forEach(aula => {

        const div =
          document.createElement("div");

        div.className = "aula";


        const titulo =
          document.createElement("h3");

        titulo.textContent =
          aula.titulo;


        const descricao =
          document.createElement("strong");

        descricao.textContent =
          aula.descricao || "";


        const conteudo =
          document.createElement("p");

        conteudo.textContent =
          aula.conteudo;


        div.appendChild(titulo);

        div.appendChild(descricao);

        div.appendChild(conteudo);

        listaAulas.appendChild(div);

      });

    }


    // CADASTRAR AULA
    formAula.addEventListener("submit", async function(event) {

      event.preventDefault();

      mensagem.textContent =
        "Salvando aula...";


      const titulo =
        document.getElementById("titulo").value;

      const descricao =
        document.getElementById("descricao").value;

      const conteudo =
        document.getElementById("conteudo").value;


      const { error } =
        await supabaseClient
          .from("aulas")
          .insert({
            titulo: titulo,
            descricao: descricao,
            conteudo: conteudo
          });


      if (error) {

        mensagem.textContent =
          "Erro ao salvar: " +
          error.message;

        return;
      }


      mensagem.textContent =
        "Aula cadastrada com sucesso!";


      formAula.reset();

      carregarAulas();

    });


    // SAIR
    btnSair.addEventListener("click", async function() {

      await supabaseClient.auth.signOut();

      painelProfessora.classList.add("oculto");

      telaLogin.classList.remove("oculto");

    });


    // VERIFICAR SE JÁ ESTÁ LOGADA
    async function iniciar() {

      const { data } =
        await supabaseClient.auth.getSession();


      if (data.session) {

        mostrarPainel();

      }

    }


    iniciar();

  </script>

</body>
</html>
