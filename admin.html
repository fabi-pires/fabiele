<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área da Professora | Bio sem mistério</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #f0f7ef;
      color: #183b20;
    }

    .painel {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px #173b201a;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #b8cbb9;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #1b5e20;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .sair {
      background: #777;
      float: right;
      margin-top: 0;
    }

    .oculto {
      display: none;
    }

    #mensagemLogin,
    #mensagem {
      margin-top: 16px;
      font-weight: bold;
    }

    .aula {
      border-top: 1px solid #d9e4da;
      padding: 18px 0;
    }

    .aula:first-child {
      border-top: 0;
    }

    .aula h3 {
      margin: 0 0 8px;
    }

    .aula p {
      white-space: pre-wrap;
      color: #526354;
    }

    .btn-excluir {
      margin-top: 8px;
      background: #b42318;
    }

    .mensagem-exclusao {
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="painel">

    <!-- TELA DE LOGIN -->
    <section id="telaLogin" class="card">

      <h1>🌿 Bio sem mistério</h1>

      <h2>Área da professora</h2>

      <p>Entre para acessar o painel.</p>

      <form id="formLogin">

        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="Digite seu e-mail"
          required
        >

        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          placeholder="Digite sua senha"
          required
        >

        <button type="submit">Entrar</button>

        <p id="mensagemLogin"></p>

      </form>

    </section>


    <!-- PAINEL DA PROFESSORA -->
    <section id="painelProfessora" class="oculto">

      <section class="card">

        <button id="btnSair" class="sair">Sair</button>

        <h1>🌿 BioAulas</h1>

        <p>Área da professora</p>

      </section>


      <section class="card">
        <h2>Solicitações de matrícula</h2>
        <p>Confira os alunos que aguardam aprovação.</p>
        <div id="listaSolicitacoes">Carregando solicitações...</div>
        <p id="mensagemSolicitacoes" role="status" aria-live="polite"></p>
      </section>

      <section class="card">

        <h2>Nova aula</h2>

        <form id="formAula">

          <label for="titulo">Título da aula</label>

          <input
            id="titulo"
            type="text"
            required
          >

          <label for="descricao">Descrição</label>

          <input
            id="descricao"
            type="text"
          >

          <label for="conteudo">Conteúdo</label>

          <textarea
            id="conteudo"
            required
          ></textarea>

          <button type="submit">
            Cadastrar aula
          </button>

          <p id="mensagem"></p>

        </form>

      </section>


      <section class="card">

        <h2>Aulas cadastradas</h2>

        <div id="listaAulas">
          Carregando aulas...
        </div>

      </section>

    </section>

  </main>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://ishkkvikgwwstisspgjc.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_6Wueqa-KQPrEeYIDl5lBQA_y0M1ySqf";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const telaLogin =
      document.getElementById("telaLogin");

    const painelProfessora =
      document.getElementById("painelProfessora");

    const formLogin =
      document.getElementById("formLogin");

    const mensagemLogin =
      document.getElementById("mensagemLogin");

    const formAula =
      document.getElementById("formAula");

    const mensagem =
      document.getElementById("mensagem");

    const listaAulas =
      document.getElementById("listaAulas");

    const btnSair =
      document.getElementById("btnSair");


    // LOGIN
    formLogin.addEventListener("submit", async function(event) {

      event.preventDefault();

      mensagemLogin.textContent = "Entrando...";


      const email =
        document.getElementById("email").value;

      const senha =
        document.getElementById("senha").value;


      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: senha
        });


      if (error) {

        mensagemLogin.textContent =
          "E-mail ou senha incorretos.";

        return;
      }


      mensagemLogin.textContent =
        "Login realizado!";


      mostrarPainel();

    });


    // MOSTRAR PAINEL
    async function mostrarPainel() {

      telaLogin.classList.add("oculto");

      painelProfessora.classList.remove("oculto");

      carregarAulas();
      carregarSolicitacoes();

    }


    // SOLICITAÇÕES DE MATRÍCULA
    async function carregarSolicitacoes() {
      const lista = document.getElementById("listaSolicitacoes");
      const aviso = document.getElementById("mensagemSolicitacoes");
      lista.textContent = "Carregando...";
      const { data, error } = await supabaseClient
        .from("perfis")
        .select("id,nome,criado_em")
        .eq("aprovado", false)
        .order("criado_em", { ascending: true });
      if (error) {
        lista.textContent = "Não foi possível carregar. Verifique se a conta da professora possui a função teacher. " + error.message;
        return;
      }
      if (!data || data.length === 0) {
        lista.textContent = "Nenhuma solicitação pendente.";
        return;
      }
      lista.innerHTML = "";
      data.forEach(perfil => {
        const item = document.createElement("div");
        item.className = "aula";
        const nome = document.createElement("strong");
        nome.textContent = perfil.nome || "Aluno sem nome";
        const botao = document.createElement("button");
        botao.type = "button";
        botao.textContent = "Aprovar matrícula";
        botao.addEventListener("click", async () => {
          if (!confirm('Aprovar o cadastro de "' + (perfil.nome || "aluno") + '"?')) return;
          botao.disabled = true;
          botao.textContent = "Aprovando...";
          const { data: atualizado, error: erroAtualizacao } = await supabaseClient
            .from("perfis").update({ aprovado: true }).eq("id", perfil.id).select("id");
          if (erroAtualizacao || !atualizado || atualizado.length === 0) {
            botao.disabled = false;
            botao.textContent = "Tentar novamente";
            aviso.textContent = erroAtualizacao ? erroAtualizacao.message : "A aprovação não foi confirmada. Verifique a permissão teacher.";
            return;
          }
          aviso.textContent = "Matrícula aprovada!";
          carregarSolicitacoes();
        });
        item.appendChild(nome);
        item.appendChild(document.createElement("br"));
        item.appendChild(botao);
        lista.appendChild(item);
      });
    }

    // CARREGAR AULAS
    async function carregarAulas() {

      const { data, error } =
        await supabaseClient
          .from("aulas")
          .select("*")
          .order("id", { ascending: false });


      if (error) {

        listaAulas.textContent =
          "Erro ao carregar aulas: " +
          error.message;

        return;
      }


      if (!data || data.length === 0) {

        listaAulas.textContent =
          "Nenhuma aula cadastrada ainda.";

        return;
      }


      listaAulas.innerHTML = "";


      data.forEach(aula => {

        const div =
          document.createElement("div");

        div.className = "aula";


        const titulo =
          document.createElement("h3");

        titulo.textContent =
          aula.titulo;


        const descricao =
          document.createElement("strong");

        descricao.textContent =
          aula.descricao || "";


        const conteudo =
          document.createElement("p");

        conteudo.textContent =
          aula.conteudo;


        div.appendChild(titulo);

        div.appendChild(descricao);

        div.appendChild(conteudo);

        const btnExcluir = document.createElement("button");
        btnExcluir.type = "button";
        btnExcluir.className = "btn-excluir";
        btnExcluir.textContent = "Excluir aula";

        const statusExclusao = document.createElement("p");
        statusExclusao.className = "mensagem-exclusao";
        statusExclusao.setAttribute("aria-live", "polite");

        btnExcluir.addEventListener("click", async function() {
          const confirmar = window.confirm(
            'Tem certeza que deseja excluir a aula "' +
            (aula.titulo || "sem título") +
            '"? Essa ação não pode ser desfeita.'
          );

          if (!confirmar) return;

          btnExcluir.disabled = true;
          btnExcluir.textContent = "Excluindo...";
          statusExclusao.textContent = "";

          const { data: dataExcluida, error: erroExclusao } = await supabaseClient
            .from("aulas")
            .delete()
            .eq("id", aula.id)
            .select("id");

          if (erroExclusao || !dataExcluida || dataExcluida.length === 0) {
            btnExcluir.disabled = false;
            btnExcluir.textContent = "Tentar excluir novamente";
            statusExclusao.textContent = erroExclusao
              ? "Não foi possível excluir: " + erroExclusao.message
              : "O Supabase não confirmou a exclusão. Isso geralmente acontece quando falta uma política de permissão DELETE (RLS) para a conta da professora. A aula continua salva.";
            return;
          }

          statusExclusao.textContent = "Aula excluída.";
          carregarAulas();
        });

        div.appendChild(btnExcluir);
        div.appendChild(statusExclusao);
        listaAulas.appendChild(div);

      });

    }


    // CADASTRAR AULA
    formAula.addEventListener("submit", async function(event) {

      event.preventDefault();

      mensagem.textContent =
        "Salvando aula...";


      const titulo =
        document.getElementById("titulo").value;

      const descricao =
        document.getElementById("descricao").value;

      const conteudo =
        document.getElementById("conteudo").value;


      const { error } =
        await supabaseClient
          .from("aulas")
          .insert({
            titulo: titulo,
            descricao: descricao,
            conteudo: conteudo
          });


      if (error) {

        mensagem.textContent =
          "Erro ao salvar: " +
          error.message;

        return;
      }


      mensagem.textContent =
        "Aula cadastrada com sucesso!";


      formAula.reset();

      carregarAulas();

    });


    // SAIR
    btnSair.addEventListener("click", async function() {

      await supabaseClient.auth.signOut();

      painelProfessora.classList.add("oculto");

      telaLogin.classList.remove("oculto");

    });


    // VERIFICAR SE JÁ ESTÁ LOGADA
    async function iniciar() {

      const { data } =
        await supabaseClient.auth.getSession();


      if (data.session) {

        mostrarPainel();

      }

    }


    iniciar();

  </script>

</body>
</html>
