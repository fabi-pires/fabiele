
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Bio sem mistério</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f7ef;
      color: #183b20;
    }

    .painel {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #173b201a;
    }

    h1 { margin-top: 0; text-align: center; }
    p { text-align: center; color: #526354; }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #b8cbb9;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1b5e20;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #mensagem { margin-top: 16px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="painel">
    <h1>🌿 BioAulas</h1>
    <p>Área administrativa da professora</p>

    <form id="formLogin">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>

    <p id="mensagem" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ishkkvikgwwstisspgjc.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzaGtrdmlrZ3d3c3Rpc3NwZ2pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MzA3NzYsImV4cCI6MjEwODIwNjc3Nn0.Cj4mBGiGjBkV2aqmwjhohltHRN1TimukobTpABdoOnY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("formLogin");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      mensagem.textContent = "Verificando acesso...";
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password: senha
      });

      if (error) {
        mensagem.textContent = "Erro do Supabase: " + error.message;
        return;
      }

      mensagem.textContent = "Login realizado com sucesso!";
    });
  </script>
</body>
</html>

</body>
</html>
