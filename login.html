<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Entrar | Bio sem Mistério</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:#f0f7ef;color:#183b20}.login{width:100%;max-width:420px;background:#fff;padding:30px;border-radius:20px;box-shadow:0 8px 30px #173b201a}h1{text-align:center;color:#1b5e20}label{display:block;margin:16px 0 7px;font-weight:bold}input{width:100%;padding:13px;border:1px solid #b8cbb9;border-radius:9px;font-size:16px}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:9px;background:#1b5e20;color:#fff;font-size:16px;font-weight:bold}button.secundario{margin-top:10px;background:#e8f2e8;color:#1b5e20;border:1px solid #b8cbb9}#mensagem{line-height:1.5}.links{text-align:center;line-height:2;margin-top:16px}.links a{color:#1b5e20}</style></head>
<body><main class="login"><h1>🌿 Área do aluno</h1><p>Entre com o e-mail e a senha usados na matrícula.</p>
<form id="formLogin"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required><button id="btnEntrar" type="submit">Entrar</button></form>
<button id="btnRecuperar" class="secundario" type="button">Esqueci minha senha</button>
<p id="mensagem" role="status" aria-live="polite"></p><div class="links"><a href="matricula.html">Ainda não tenho cadastro</a><br><a href="index.html">Voltar ao início</a><br><a href="admin.html">Acesso da professora</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://ishkkvikgwwstisspgjc.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzaHkkdmlrZ3d3c3Rpc3NwZ2pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MzA3NzYsImV4cCI6MjEwODIwNjc3Nn0.Cj4mBGiGjBkV2aqmwjhohltHRN1TimukobTpABdoOnY";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const msg=document.getElementById("mensagem");
document.getElementById("btnRecuperar").addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim().toLowerCase();
 if(!email){msg.textContent="Digite seu e-mail no campo acima e toque novamente em Esqueci minha senha.";document.getElementById("email").focus();return;}
 const btn=document.getElementById("btnRecuperar");btn.disabled=true;btn.textContent="Enviando...";
 let error; try { ({error}=await db.auth.resetPasswordForEmail(email,{redirectTo:"https://fabi-pires.github.io/fabiele/redefinir-senha.html"})); } catch(e) { error=e; }
 if(error){msg.textContent="Não foi possível enviar o e-mail: "+error.message;btn.disabled=false;btn.textContent="Tentar novamente";return;}
 msg.textContent="Se esse e-mail estiver cadastrado, enviaremos um link para criar uma nova senha. Confira também o spam.";
 btn.textContent="E-mail solicitado";
});
document.getElementById("formLogin").addEventListener("submit",async e=>{
e.preventDefault();const btn=document.getElementById("btnEntrar");btn.disabled=true;btn.textContent="Verificando...";
let data,error; try { ({data,error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim().toLowerCase(),password:document.getElementById("senha").value})); } catch(e) { error=e; }
if(error){msg.textContent="Não foi possível entrar. Confira seus dados e confirme seu e-mail, se solicitado.";btn.disabled=false;btn.textContent="Entrar";return;}
const {data:perfil,error:pe}=await db.from("perfis").select("nome,aprovado").eq("id",data.user.id).maybeSingle();
if(pe||!perfil||perfil.aprovado!==true){msg.textContent=pe?"Não foi possível verificar sua matrícula. Fale com a professora.":"Sua solicitação ainda aguarda aprovação da professora.";await db.auth.signOut();btn.disabled=false;btn.textContent="Entrar";return;}
location.href="aluno.html";
});
</script></body></html>
