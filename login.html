
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Painel Escolar</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f8fafc);
            color: #1e293b;
        }

        .login-container {
            width: 100%;
            max-width: 410px;
            padding: 32px 26px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(30, 64, 175, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .aviso {
            text-align: center;
            color: #64748b;
            margin-top: 18px;
        }

        .voltar {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="logo">🎓</div>
        <h1>Bem-vindo!</h1>
        <p class="subtitulo">Entre para acessar o painel escolar.</p>

        <form id="formLogin">
            <label for="usuario">Usuário</label>
            <input id="usuario" type="text"
                   placeholder="Digite seu usuário" required>

            <label for="senha">Senha</label>
            <input id="senha" type="password"
                   placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
        </form>

        <p class="aviso" id="mensagem">
            Acesso de teste para alunos.
        </p>

        <a class="voltar" href="index.html">← Voltar ao início</a>
    </main>

    <script>
        const formulario = document.getElementById("formLogin");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value;

            if (usuario === "aluno" && senha === "123456") {
                window.location.href = "aluno.html";
            } else {
                document.getElementById("mensagem").textContent =
                    "Usuário ou senha incorretos. Tente novamente.";
            }
        });
    </script>
</body>
</html>
